<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareHarness Studio</title><link rel="stylesheet" href="/styles.css"><style>
.experiment-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:15px 0 22px}.experiment-metrics>div{border:1px solid var(--line);border-radius:9px;padding:11px;background:#fafbfc}.experiment-metrics .metric{font-size:20px}.answer-box,.observation-text{white-space:pre-wrap;min-width:180px;max-width:460px}.answer-box{font-weight:650;color:#172b4d}@media(max-width:1050px){.experiment-metrics{grid-template-columns:1fr 1fr}}@media(max-width:720px){.experiment-metrics{grid-template-columns:1fr}}
.latest-experiment-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}.model-note{display:flex;gap:8px 24px;flex-wrap:wrap;padding:10px 12px;margin:10px 0 14px;border-radius:8px;background:#edf3f0;color:#34473f;font-size:11px}.model-note b{color:var(--teal)}.literature-result-table{border:1px solid var(--line);border-radius:9px;margin:12px 0 20px;background:#fff}.literature-result-table table{min-width:780px;font-variant-numeric:tabular-nums}.literature-result-table thead{background:#edf3f0;color:#34473f}.literature-result-table th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}.literature-result-table th:not(:first-child),.literature-result-table td:not(:first-child){text-align:right}.literature-result-table tbody tr:hover{background:#fafcfb}.literature-result-table .score-average{background:#e8f6ee;color:#14634e}.previous-experiment-row{background:#f8faf9}.experiment-delta-row{background:#f4f8f6}.score-delta{display:inline-block;padding:2px 6px;border-radius:999px;font-size:10px;font-weight:750;white-space:nowrap}.score-delta.positive{background:#dff4e8;color:#14634e}.score-delta.negative{background:#fde8e7;color:#9a2f2a}.score-delta.neutral{background:#edf0ef;color:#52615b}.score-delta.unavailable{background:#f2f3f3;color:#78817d;font-weight:600}@media(max-width:720px){.latest-experiment-head{display:block}.latest-experiment-head button{margin-top:10px}}
.checkbox-field{grid-template-columns:auto 1fr;align-items:center;align-content:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.checkbox-field input{width:auto;margin:0}.checkbox-field .small{grid-column:1/-1;font-weight:500}
.benchmark-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}.benchmark-flow span{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#f8fbfa}.benchmark-flow b{color:var(--teal)}.checkgrid,.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.two-col>article{border:1px solid var(--line);border-radius:9px;padding:14px;background:#fafbfc}@media(max-width:720px){.checkgrid,.two-col{grid-template-columns:1fr}}
</style></head><body>
<aside><div class="brand"><span>CARE</span>HARNESS<small>Longitudinal control studio</small></div><nav id="nav"></nav><div id="build" class="build"></div></aside>
<main><header><div><p class="eyebrow" id="eyebrow">WORKSPACE</p><h1 id="title">CareHarness Studio</h1><p id="subtitle"></p></div><div class="health" id="health">正在连接后端…</div></header><div id="app"><div class="loading">正在载入系统状态…</div></div></main>
<div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
